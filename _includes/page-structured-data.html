{% assign site_origin = site.production_url | default: site.url %}
{% assign page_url = page.url | relative_url | prepend: site_origin %}

{% if page.url != '/' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": {{ site_origin | append: '/' | jsonify }}
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": {{ page.title | default: site.title | jsonify }},
      "item": {{ page_url | jsonify }}
    }
  ]
}
</script>
{% endif %}

{% if page.service_schema %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Service",
  "name": {{ page.service_schema.name | default: page.title | jsonify }},
  "description": {{ page.description | jsonify }},
  "url": {{ page_url | jsonify }},
  "provider": {
    "@type": "LocalBusiness",
    "name": {{ site.company | default: site.title | jsonify }},
    "url": {{ site_origin | jsonify }},
    "email": {{ site.email | jsonify }},
    "telephone": {{ site.phone | jsonify }},
    "address": {
      "@type": "PostalAddress",
      "addressLocality": {{ site.address | default: 'Durban' | jsonify }},
      "addressCountry": "ZA"
    }
  },
  "areaServed": {
    "@type": {{ page.service_schema.area_type | default: 'Country' | jsonify }},
    "name": {{ page.service_schema.area_name | default: 'South Africa' | jsonify }}
  },
  "serviceType": {{ page.service_schema.service_type | default: page.title | jsonify }}
}
</script>
{% endif %}

{% if page.faq_items %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {% for item in page.faq_items %}
    {
      "@type": "Question",
      "name": {{ item.question | jsonify }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ item.answer | jsonify }}
      }
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ]
}
</script>
{% endif %}

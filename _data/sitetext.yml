faq:
  show: true
  kicker: Common Questions
  title: Website subscriptions, without the guesswork.
  subtitle: Clear answers for South African businesses comparing website costs, timelines, hosting, local support, and SEO support.
  items:
    - question: How much does a business website cost in South Africa?
      answer: Intellify's limited Starter offer is R99 per month, normally R150 per month, with no upfront build cost. Traditional business websites often require a large once-off build fee before hosting, domain renewal, updates, and support are added.
    - question: What is included in your monthly website plans?
      answer: Every plan includes domain registration, annual domain renewal worth R150, monthly hosting worth R100, custom website design, mobile-friendly pages, and ongoing technical support. Higher plans add features such as contact forms, monthly content changes, embedded video, SEO-focused build work, and analytics.
    - question: How long does it take to get my website live?
      answer: Starter websites are designed for a fast launch, often within 48 hours once the core content is ready. Larger multi-page sites usually take longer, depending on the number of pages, features, images, and approvals needed.
    - question: Do you build websites with SEO in mind?
      answer: Yes. Intellify websites are built to be fast, mobile-friendly, easy to crawl, and structured around the services and locations your customers search for. Premium plans include additional SEO support and analytics so you can understand how visitors find and use your site.
    - question: Will my website help me compete with other local businesses?
      answer: Yes. Your site is built to make your business look established, trustworthy, and easy to contact online. We focus on clear service pages, strong calls to action, mobile speed, and local search signals so customers can find you before they choose someone else.
    - question: Do you offer local South African support?
      answer: Yes. Intellify is South African owned and operated, with local support for updates, fixes, hosting questions, and launch guidance. You are not left with a website you do not know how to manage.
    - question: Can you connect my website to WhatsApp and enquiries?
      answer: Yes. We can add WhatsApp click-to-chat, enquiry buttons, contact forms, booking links, maps, and tracking so visitors have a clear next step and you can respond quickly.
    - question: What makes Intellify different from a once-off website build?
      answer: We build, host, maintain, and support your website as one managed subscription. That means no large build fee, no separate hosting admin, no renewal surprises, and no technical stress when something needs to change.

